name: 'PolicyGuard IaC Security Scanner'
description: 'Scan Infrastructure as Code for security vulnerabilities and policy violations'
author: 'PolicyGuard'

inputs:
  target:
    description: 'Target directory or file to scan'
    required: false
    default: '.'
  
  policy-path:
    description: 'Path to custom policy files'
    required: false
    default: 'policies/'
  
  format:
    description: 'Output format (human, json, sarif, junit)'
    required: false
    default: 'sarif'
  
  output-file:
    description: 'Output file path'
    required: false
    default: 'policyguard-results.sarif'
  
  fail-on-error:
    description: 'Fail the action if violations are found'
    required: false
    default: 'true'

  upload-sarif:
    description: 'Upload SARIF results to GitHub Security tab'
    required: false
    default: 'true'
  
  comment-pr:
    description: 'Comment on PR with scan results'
    required: false
    default: 'true'

outputs:
  violations-found:
    description: 'Whether security violations were found'
    value: ${{ steps.scan.outputs.violations-found }}
  
  total-violations:
    description: 'Total number of violations found'
    value: ${{ steps.scan.outputs.total-violations }}
  
  critical-violations:
    description: 'Number of critical violations'
    value: ${{ steps.scan.outputs.critical-violations }}
  
  high-violations:
    description: 'Number of high severity violations'
    value: ${{ steps.scan.outputs.high-violations }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install PolicyGuard
      shell: bash
      run: |
        echo "Installing PolicyGuard..."
        go install github.com/ToluGIT/policyguard/cmd/policyguard@latest
    
    - name: Run PolicyGuard Scan
      id: scan
      shell: bash
      run: |
        echo "Running PolicyGuard scan..."

        # Base command (policy path is optional).
        SCAN_CMD="policyguard scan ${{ inputs.target }}"
        if [ "${{ inputs.policy-path }}" != "policies/" ]; then
          SCAN_CMD="$SCAN_CMD -p ${{ inputs.policy-path }}"
        fi

        # Gating run: pass --fail-on-error so the exit code reflects findings.
        # Exit codes: 0 = clean, 1 = violations, 2 = scan error (bad input,
        # unreadable/invalid policy). WITHOUT --fail-on-error the scan exits 0
        # even when it finds violations, which makes the gate fail OPEN.
        set +e
        $SCAN_CMD -f ${{ inputs.format }} -o ${{ inputs.output-file }} --fail-on-error
        SCAN_EXIT_CODE=$?
        set -e

        # Exit 2 = the scan could not complete. A broken scan is not a passing
        # scan; stop immediately rather than reporting a false "clean".
        if [ "$SCAN_EXIT_CODE" -eq 2 ]; then
          echo "::error::PolicyGuard failed to run (exit 2). Check the target path and policy files."
          exit 2
        fi

        # Informational human report for the summary/PR comment (not gated).
        $SCAN_CMD -o policyguard-human.txt || true

        # Parse summary counts for action outputs.
        if [ -f "policyguard-human.txt" ]; then
          TOTAL_VIOLATIONS=$(grep "Total Violations Found:" policyguard-human.txt | awk '{print $4}')
          CRITICAL=$(grep "CRITICAL:" policyguard-human.txt | awk '{print $2}' || echo "0")
          HIGH=$(grep "HIGH:" policyguard-human.txt | awk '{print $2}' || echo "0")

          echo "violations-found=$( [ "${TOTAL_VIOLATIONS:-0}" -gt 0 ] && echo "true" || echo "false" )" >> $GITHUB_OUTPUT
          echo "total-violations=${TOTAL_VIOLATIONS:-0}" >> $GITHUB_OUTPUT
          echo "critical-violations=${CRITICAL:-0}" >> $GITHUB_OUTPUT
          echo "high-violations=${HIGH:-0}" >> $GITHUB_OUTPUT
        fi

        # Store exit code for the gating step.
        echo "SCAN_EXIT_CODE=$SCAN_EXIT_CODE" >> $GITHUB_ENV
    
    - name: Upload SARIF to GitHub Security
      if: inputs.upload-sarif == 'true' && inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: ${{ inputs.output-file }}
        category: policyguard
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request' && inputs.comment-pr == 'true'
      uses: actions/github-script@v6
      with:
        script: |
          // Post only aggregate counts to the PR comment. We deliberately do NOT
          // paste the full scan report here: on a public repo a PR comment is
          // world-readable, and the report can echo values from the scanned .tf
          // (including a hardcoded credential a policy flagged). Detailed findings
          // live in the Security tab (SARIF upload) and the build artifacts,
          // which respect repo access controls.
          const totalViolations = '${{ steps.scan.outputs.total-violations }}';
          const criticalCount = '${{ steps.scan.outputs.critical-violations }}';
          const highCount = '${{ steps.scan.outputs.high-violations }}';

          let comment = '## PolicyGuard Security Scan Results\n\n';

          if (totalViolations === '0') {
            comment += '**No security violations found.**\n';
          } else {
            comment += `**Found ${totalViolations} security violation(s)**\n\n`;
            if (Number(criticalCount) > 0) comment += `- Critical: ${criticalCount}\n`;
            if (Number(highCount) > 0) comment += `- High: ${highCount}\n`;
            comment += '\nSee the **Security tab** (SARIF) and the build artifacts ' +
                       'for per-finding detail. Detailed findings are intentionally ' +
                       'not posted here to avoid exposing scanned configuration values ' +
                       'in a public comment.\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Check failure condition
      if: inputs.fail-on-error == 'true'
      shell: bash
      run: |
        # SCAN_EXIT_CODE comes from a --fail-on-error run: 1 = violations found
        # (exit 2 / scan error was already handled and failed the scan step).
        if [ "$SCAN_EXIT_CODE" -eq 1 ]; then
          echo "PolicyGuard found security violations!"
          exit 1
        fi

branding:
  icon: 'shield'
  color: 'blue'
