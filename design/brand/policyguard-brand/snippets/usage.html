<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PolicyGuard — logo usage snippet</title>

  <!-- ─── FAVICON / APP ICON SET ─── -->
  <link rel="icon" type="image/svg+xml" href="svg/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="png/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="png/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="png/apple-touch-icon-180.png" />

  <style>
    /* Inline-SVG approach: color the shield with `color`, prompt stays accent. */
    .pg-mark { color: #F4F4F5; }            /* on dark */
    .pg-mark--active { color: #C2F24A; }    /* active nav item: whole mark lime */
  </style>
</head>
<body style="background:#0A0A0B;color:#F4F4F5;font-family:'IBM Plex Mono',monospace;padding:32px;">

  <!-- A) Inline SVG (best for theming — shield follows `color`) -->
  <span class="pg-mark" style="display:inline-flex">
    <svg width="32" height="33" viewBox="0 0 100 104" fill="none" aria-label="PolicyGuard">
      <path d="M50 6 L88 20 V54 C88 80 50 98 50 98 C50 98 12 80 12 54 V20 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path d="M37 42 L49 52 L37 62" stroke="#C2F24A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M55 62 H69" stroke="#C2F24A" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
  </span>

  <!-- B) Drop-in file reference -->
  <img src="svg/mark-on-dark.svg" width="32" height="33" alt="PolicyGuard" />

  <!-- C) Full lockup -->
  <img src="svg/lockup-horizontal.svg" height="28" alt="PolicyGuard" />

</body>
</html>
