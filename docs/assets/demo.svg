<text x="394.5" y="18" fill="#969896" text-anchor="middle" font-size="12">policyguard — demo</text>
<text xml:space="preserve" x="16" y="44" fill="#b5bd68">$ policyguard scan examples/demo/main.tf</text>
<text xml:space="preserve" x="16" y="62" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="80" fill="#c5c8c6">================================================================================</text>
