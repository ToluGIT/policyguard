<text xml:space="preserve" x="16" y="188" fill="#c5c8c6">----------------------------------------</text>
<text xml:space="preserve" x="16" y="206" fill="#c5c8c6">Total Resources Scanned: 2</text>
<text xml:space="preserve" x="16" y="224" fill="#c5c8c6">Total Violations Found:  4</text>
<text xml:space="preserve" x="16" y="242" fill="#c5c8c6">Pass Rate:               0.0%</text>
<text xml:space="preserve" x="16" y="260" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="278" fill="#c5c8c6">Violations by Severity:</text>
<text xml:space="preserve" x="16" y="296" fill="#cc6666">  CRITICAL:  2</text>
<text xml:space="preserve" x="16" y="314" fill="#c5c8c6">  HIGH:      1</text>
<text xml:space="preserve" x="16" y="332" fill="#c5c8c6">  MEDIUM:    1</text>
<text xml:space="preserve" x="16" y="350" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="368" fill="#f0c674">VIOLATIONS</text>
<text xml:space="preserve" x="16" y="386" fill="#c5c8c6">----------------------------------------</text>
<text xml:space="preserve" x="16" y="404" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="422" fill="#cc6666">[CRITICAL]</text>
<text xml:space="preserve" x="16" y="440" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="458" fill="#c5c8c6">1. S3 bucket &#x27;data&#x27; has public ACL &#x27;public-read&#x27;</text>
<text xml:space="preserve" x="16" y="476" fill="#c5c8c6">   Resource: aws_s3_bucket.data</text>
<text xml:space="preserve" x="16" y="494" fill="#c5c8c6">   Location: examples/demo/main.tf:5:1</text>
<text xml:space="preserve" x="16" y="512" fill="#c5c8c6">   Policy:   s3_bucket_public_access</text>
<text xml:space="preserve" x="16" y="530" fill="#c5c8c6">   Details:  S3 buckets should not allow public access through ACLs</text>
<text xml:space="preserve" x="16" y="548" fill="#c5c8c6">   Fix:      Set acl to &#x27;private&#x27; and use bucket policies for controlled access</text>
<text xml:space="preserve" x="16" y="566" fill="#c5c8c6">   Suggested HCL:</text>
<text xml:space="preserve" x="16" y="584" fill="#c5c8c6">     acl = &quot;private&quot;</text>
<text xml:space="preserve" x="16" y="602" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="620" fill="#c5c8c6">2. Security group &#x27;web&#x27; allows SSH access from anywhere</text>
<text xml:space="preserve" x="16" y="638" fill="#c5c8c6">   Resource: aws_security_group.web</text>
<text xml:space="preserve" x="16" y="656" fill="#c5c8c6">   Location: examples/demo/main.tf:10:1</text>
<text xml:space="preserve" x="16" y="674" fill="#c5c8c6">   Policy:   security_group_ssh_open</text>
<text xml:space="preserve" x="16" y="692" fill="#c5c8c6">   Details:  SSH (port 22) should not be open to 0.0.0.0/0</text>
<text xml:space="preserve" x="16" y="710" fill="#c5c8c6">   Fix:      Restrict SSH access to specific IP ranges or use AWS Systems Manager Session Manager</text>
<text xml:space="preserve" x="16" y="728" fill="#c5c8c6">   Suggested HCL:</text>
<text xml:space="preserve" x="16" y="746" fill="#c5c8c6">     cidr_blocks = [&quot;10.0.0.0/8&quot;] # Update with your specific IP range</text>
<text xml:space="preserve" x="16" y="764" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="782" fill="#969896">... 2 more findings (HIGH: encryption, MEDIUM: access logging)</text>
<text xml:space="preserve" x="16" y="800" fill="#c5c8c6"> </text>
<text xml:space="preserve" x="16" y="818" fill="#b5bd68">$ echo $?   # fail-closed exit code under --fail-on-error</text>
<text xml:space="preserve" x="16" y="836" fill="#c5c8c6">1</text>
